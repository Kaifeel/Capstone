<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StagePass - 예매 완료</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html">
        <span class="mark">S</span>
        <span>StagePass</span>
      </a>
      <div class="nav-links">
        <a href="index.html">공연</a>
        <a href="queue.html">대기열</a>

      <div class="screen-title">

          <span>결제 상태</span>

      </div>
      <a class="btn primary" href="index.html">처음으로</a>
