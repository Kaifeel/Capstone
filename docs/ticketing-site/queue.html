<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StagePass - 대기열</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html">
        <span class="mark">S</span>
        <span>StagePass</span>
      </a>
      <div class="nav-links">
        <a href="index.html">공연</a>
        <a href="queue.html">대기열</a>
        <a href="seats.html">좌석</a>
        <a href="payment.html">결제</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="screen-title">
      <div>
        <h2>대기열</h2>
        <p class="muted">입장 가능 상태가 되면 좌석 선택 화면으로 이동합니다.</p>
      </div>
      <a class="btn" href="index.html">공연 변경</a>
    </div>

    <div class="panel">
      <h3>Midnight Echo Live 입장 대기</h3>
      <div class="queue-box">
        <div class="metric">
          <span>내 순번</span>
          <b>184</b>
        </div>
        <div class="metric">
          <span>예상 대기</span>
          <b>02:10</b>
        </div>
        <div class="metric">
          <span>입장 처리</span>
          <b>68%</b>
        </div>
      </div>
      <div class="progress"><span></span></div>
      <p class="muted">Redis Sorted Set 기준으로 순번이 계산됩니다. 입장 허용 후 entryToken이 발급됩니다.</p>
      <div class="status-row">
        <span class="badge blue">WAITING</span>
        <span class="badge green">상위 N명 승격</span>
        <span class="badge amber">토큰 TTL 적용</span>
      </div>
      <div style="margin-top: 24px;">
        <a class="btn primary" href="seats.html">입장 완료: 좌석 선택</a>
      </div>
    </div>
  </main>
</body>
</html>
